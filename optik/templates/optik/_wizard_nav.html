<div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
    {% if wizard_prev %}
    <a href="{{ wizard_prev.url }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>{{ wizard_prev.label }}</a>
    {% else %}<span></span>{% endif %}
    {% if wizard_next %}
    <a href="{{ wizard_next.url }}" class="btn btn-primary">{{ wizard_next.label }}<i class="bi bi-arrow-right ms-1"></i></a>
    {% else %}<span></span>{% endif %}
</div>
